name: scientific-search

services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    shm_size: 512mb
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  email:
    build:
      context: ..
      dockerfile: deploy/docker/emailsender.Dockerfile
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: ${EMAIL_JAVA_OPTIONS}
      SENDER_PORT: 8771
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_TEST_CONNECTION: ${MAIL_TEST_CONNECTION:-true}
    networks: [backend]

  authorization:
    build:
      context: ..
      dockerfile: deploy/docker/authorization.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      email:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: ${AUTH_JAVA_OPTIONS}
      AUTH_SERVER_PORT: 5555
      AUTH_DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      AUTH_DB_USERNAME: ${POSTGRES_USER}
      AUTH_DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_LISTENER_ENABLED: "false"
      EUREKA_ENABLED: "false"
      ACCOUNT_SERVICE_ENABLED: "false"
      EMAIL_SERVICE_URL: http://email:8771
      SEARCH_APP_URL: ${APP_PUBLIC_URL}
      REGISTRATION_DEFAULT_ROLE: USER
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
    networks: [backend]

  search:
    build:
      context: ..
      dockerfile: deploy/docker/search.Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
      authorization:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      JAVA_TOOL_OPTIONS: ${SEARCH_JAVA_OPTIONS}
      DB_URL: jdbc:postgresql://database:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SECURITY_MODE: basic
      AUTH_SERVICE_ENABLED: "true"
      AUTH_SERVICE_URL: http://authorization:5555
      AUTH_OPENAPI_URL: http://authorization:5555/v3/api-docs
      EMAIL_OPENAPI_URL: http://email:8771/v3/api-docs
      CORS_ALLOWED_ORIGINS: ${APP_PUBLIC_URL}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_SERVLET_SESSION_COOKIE_HTTP_ONLY: "true"
      SERVER_SERVLET_SESSION_COOKIE_SAME_SITE: lax
      OPENAI_ENABLED: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-LM Studio}
      OPENAI_BASE_URL: ${LLM_BASE_URL}
      OPENAI_API_KEY: ${LLM_API_KEY}
      OPENAI_MODEL: ${LLM_MODEL}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-120}
      OPENAI_RETRY_ATTEMPTS: ${OPENAI_RETRY_ATTEMPTS:-1}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-128}
      OPENAI_MAX_CONCURRENT_REQUESTS: ${OPENAI_MAX_CONCURRENT_REQUESTS:-1}
      OPENAI_QUEUE_TIMEOUT_MILLIS: ${OPENAI_QUEUE_TIMEOUT_MILLIS:-750}
      OPENAI_BACKGROUND_TIMEOUT_SECONDS: ${OPENAI_BACKGROUND_TIMEOUT_SECONDS:-35}
      OPENAI_BACKGROUND_MAX_OUTPUT_TOKENS: ${OPENAI_BACKGROUND_MAX_OUTPUT_TOKENS:-320}
      OPENAI_BACKGROUND_BASE_URL: ${LLM_BACKGROUND_BASE_URL:-}
      OPENAI_BACKGROUND_API_KEY: ${LLM_BACKGROUND_API_KEY:-${LLM_API_KEY}}
      OPENAI_BACKGROUND_MODEL: ${LLM_BACKGROUND_MODEL:-${LLM_MODEL}}
      OPENAI_CIRCUIT_FAILURE_THRESHOLD: ${OPENAI_CIRCUIT_FAILURE_THRESHOLD:-2}
      OPENAI_CIRCUIT_COOLDOWN_SECONDS: ${OPENAI_CIRCUIT_COOLDOWN_SECONDS:-30}
      OPENAI_RESPONSE_CACHE_TTL_SECONDS: ${OPENAI_RESPONSE_CACHE_TTL_SECONDS:-600}
      ASSISTANT_RAG_MAX_DOCUMENTS: ${ASSISTANT_RAG_MAX_DOCUMENTS:-6}
      ASSISTANT_RAG_MAX_CHARS_PER_DOCUMENT: ${ASSISTANT_RAG_MAX_CHARS_PER_DOCUMENT:-2000}
      ASSISTANT_RAG_MAX_INPUT_CHARS: ${ASSISTANT_RAG_MAX_INPUT_CHARS:-14000}
      ASSISTANT_RAG_LOCAL_CONTEXT_CHARS: ${ASSISTANT_RAG_LOCAL_CONTEXT_CHARS:-1200}
      ASSISTANT_RAG_MAX_DOCUMENTS_PER_SOURCE: ${ASSISTANT_RAG_MAX_DOCUMENTS_PER_SOURCE:-2}
      ASSISTANT_EMBEDDING_ENABLED: "true"
      # Generation and embeddings deliberately use separate CPU processes in
      # production. A long answer must not block semantic retrieval/indexing.
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-${LLM_BASE_URL}}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-${LLM_API_KEY}}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      ASSISTANT_EMBEDDING_BATCH_SIZE: ${ASSISTANT_EMBEDDING_BATCH_SIZE:-128}
      ASSISTANT_EMBEDDING_SCAN_BATCH_SIZE: ${ASSISTANT_EMBEDDING_SCAN_BATCH_SIZE:-256}
      ASSISTANT_QUERY_CACHE_TTL_SECONDS: ${ASSISTANT_QUERY_CACHE_TTL_SECONDS:-900}
      ASSISTANT_EMBEDDING_AUTO_RETRY_FAILED: "true"
      ASSISTANT_EMBEDDING_RETRY_DELAY_SECONDS: ${ASSISTANT_EMBEDDING_RETRY_DELAY_SECONDS:-300}
      ASSISTANT_SLO_MAX_FALLBACK_RATE: ${ASSISTANT_SLO_MAX_FALLBACK_RATE:-0.01}
      ASSISTANT_VECTOR_INDEX_PATH: /app/data/assistant-vectors
      INDEXING_SITE_PARALLELISM: ${INDEXING_SITE_PARALLELISM:-4}
      INDEXING_CRAWL_PARALLELISM: ${INDEXING_CRAWL_PARALLELISM:-8}
      INDEXING_MAX_PAGES_PER_SITE: ${INDEXING_MAX_PAGES_PER_SITE:-1000}
      ASSISTANT_RATE_LIMIT_PER_MINUTE: ${ASSISTANT_RATE_LIMIT_PER_MINUTE:-20}
      SCOPUS_API_KEY: ${SCOPUS_API_KEY:-}
    volumes:
      - assistant_vectors:/app/data/assistant-vectors
      - search_logs:/app/logs
    networks: [backend]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      search:
        condition: service_started
    environment:
      APP_HOST: ${APP_HOST}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]

networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  postgres18_data:
  redis_data:
  assistant_vectors:
  search_logs:
  caddy_data:
  caddy_config:
