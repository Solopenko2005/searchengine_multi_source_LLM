spring:
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/search_engine}
    username: ${AUTH_DB_USERNAME:postgres}
    password: ${AUTH_DB_PASSWORD:}
    hikari:
      schema: auth_schema
      connection-init-sql: CREATE SCHEMA IF NOT EXISTS auth_schema;
      connection-timeout: 10000
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

eureka:
  client:
    enabled: false

email:
  service:
    url: ${EMAIL_SERVICE_URL:http://localhost:8771}

app:
  frontend:
    base-url: ${SEARCH_APP_URL:http://localhost:8080}
  integrations:
    account-service-enabled: false
  registration:
    default-role: ${REGISTRATION_DEFAULT_ROLE:USER}
    bootstrap-admin-emails: ${BOOTSTRAP_ADMIN_EMAILS:}
  jwt:
    secret: ${AUTH_JWT_SECRET:}

server:
  port: ${AUTH_SERVER_PORT:5555}
