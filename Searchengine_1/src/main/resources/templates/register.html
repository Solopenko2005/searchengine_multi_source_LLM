<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Регистрация — поисковая система</title>
    <link rel="stylesheet" href="/assets/css/fonts.css">
    <link rel="stylesheet" href="/assets/css/login.css">
</head>
<body>
<main class="auth-layout auth-layout_register">
    <img class="auth-logo" src="/assets/img/auth-logo.png" alt="Логотип поисковой системы">

    <div class="auth-container">
        <section class="auth-intro" aria-labelledby="welcome-title">
            <div class="auth-intro__content">
                <h1 id="welcome-title">Создайте аккаунт</h1>
                <p>
                    После регистрации вам будет назначена роль администратора поисковой системы.
                    Вы сможете индексировать источники и документы, выполнять поиск и работать с LLM-ассистентом.
                </p>
                <a class="auth-secondary-action" href="/login">Уже есть аккаунт</a>
            </div>

            <footer class="auth-footer">
                <span>Поисковая система</span>
                <span>Доступ: <strong>Администратор</strong></span>
            </footer>
        </section>

        <section class="login-card registration-card" aria-labelledby="registration-title">
            <h2 id="registration-title">Регистрация</h2>

            <div class="login-message login-message_error" role="alert" th:if="${registrationError}"
                 th:text="${registrationError}"></div>

            <form class="login-form registration-form" th:action="@{/register}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

                <div class="registration-name-row">
                    <div class="login-field">
                        <label for="firstName">Имя</label>
                        <input id="firstName" name="firstName" type="text" autocomplete="given-name"
                               th:value="${firstName}" required autofocus>
                    </div>
                    <div class="login-field">
                        <label for="lastName">Фамилия</label>
                        <input id="lastName" name="lastName" type="text" autocomplete="family-name"
                               th:value="${lastName}" required>
                    </div>
                </div>

                <div class="login-field">
                    <label for="email">E-mail</label>
                    <input id="email" name="email" type="email" autocomplete="email"
                           autocapitalize="none" spellcheck="false" th:value="${email}" required>
                </div>

                <div class="login-field">
                    <label for="password">Пароль — не менее 8 символов</label>
                    <input id="password" name="password" type="password" autocomplete="new-password"
                           minlength="8" required>
                </div>

                <div class="login-field">
                    <label for="confirmPassword">Повторите пароль</label>
                    <input id="confirmPassword" name="confirmPassword" type="password"
                           autocomplete="new-password" minlength="8" required>
                </div>

                <button class="login-submit registration-submit" type="submit">Зарегистрироваться</button>
            </form>
        </section>
    </div>

    <div class="auth-waves" aria-hidden="true">
        <svg viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z"></path>
            </defs>
            <g>
                <use href="#gentle-wave" x="48" y="0" fill="#EAF3B2"></use>
                <use href="#gentle-wave" x="48" y="3" fill="#D4E08C"></use>
                <use href="#gentle-wave" x="48" y="5" fill="#BECD6E"></use>
                <use href="#gentle-wave" x="48" y="7" fill="#A8BA50"></use>
            </g>
        </svg>
    </div>
</main>
</body>
</html>
