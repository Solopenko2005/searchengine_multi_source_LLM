<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title data-i18n-title="reset.title">Новый пароль</title>
    <link rel="stylesheet" href="/assets/css/fonts.css"><link rel="stylesheet" href="/assets/css/login.css?v=20260811-2"><script defer src="/assets/js/i18n.js?v=20260811-2"></script>
</head>
<body>
<main class="auth-layout auth-layout_register">
    <div class="LanguageSwitch AuthLanguageSwitch"><button type="button" data-language="ru">RU</button><button type="button" data-language="en">EN</button></div>
    <img class="auth-logo" src="/assets/img/auth-logo.png" alt="Логотип" data-i18n-alt="auth.logo">
    <div class="auth-container">
        <section class="auth-intro"><div class="auth-intro__content">
            <h1 data-i18n="reset.new">Новый пароль</h1><p data-i18n="reset.instructions">Придумайте новый пароль длиной не менее восьми символов.</p>
        </div><footer class="auth-footer"><span data-i18n="app.name">Поисковая система</span><span data-language-label><span data-i18n="language.label">Язык:</span> <strong data-i18n="language.ru">Русский</strong></span></footer></section>
        <section class="login-card">
            <h2 data-i18n="reset.change">Изменение пароля</h2>
            <div class="login-message login-message_error" th:if="${recoveryError}" th:text="${recoveryError}"></div>
            <form class="login-form" action="/password-reset" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">
                <div class="login-field"><label for="password" data-i18n="reset.new">Новый пароль</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required autofocus>
                </div>
                <div class="login-field"><label for="confirmPassword" data-i18n="auth.confirmPassword">Повторите пароль</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                </div>
                <button class="login-submit" type="submit" data-i18n="reset.save">Сохранить пароль</button>
            </form>
        </section>
    </div>
    <div class="auth-waves" aria-hidden="true"><svg viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto"><defs><path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z"></path></defs><g><use href="#gentle-wave" x="48" y="0" fill="#EAF3B2"></use><use href="#gentle-wave" x="48" y="3" fill="#D4E08C"></use><use href="#gentle-wave" x="48" y="5" fill="#BECD6E"></use><use href="#gentle-wave" x="48" y="7" fill="#A8BA50"></use></g></svg></div>
</main>
</body>
</html>
