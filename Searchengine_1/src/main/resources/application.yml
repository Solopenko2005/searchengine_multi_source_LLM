server:
  port: 8080

springdoc:
  paths-to-match: /api/**
  swagger-ui:
    path: /api-docs
    disable-swagger-default-url: true
    display-request-duration: true
    doc-expansion: none
    filter: true
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
    csrf:
      enabled: true
    urls-primary-name: "1. Поисковая система"
    urls:
      - name: "1. Поисковая система"
        url: /v3/api-docs
      - name: "2. Авторизация"
        url: /api/admin/openapi/authorization
      - name: "3. Отправка e-mail (внутренний модуль)"
        url: /api/admin/openapi/email

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.hibernate.transaction: WARN
    org.hibernate.engine: WARN
    searchengine: INFO
    com.zaxxer.hikari: WARN
    liquibase: INFO

  file:
    name: logs/application.log                # Сохранение логов в файл
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"  # Формат логов в файле
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n" # Формат логов в консоли

spring:
  config:
    # Spring Boot does not read .env automatically. Import it explicitly both
    # for launches from the repository root and from the Searchengine_1 module.
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/search_engine}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      enabled: true
      # Large uploads are spooled to disk instead of being retained in the JVM heap.
      file-size-threshold: 2MB
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:200MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:1GB}

  jpa:
    hibernate:
      ddl-auto: none  # Отключаем автоматическое создание таблиц через Hibernate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master_topic.xml  # Файл с миграциями
# Настройки LLM-ассистента (вкладка «Ассистент»), использующего OpenAI Responses API.
# Ключ и модель задаются только через переменные окружения.
# Если ключ не задан — ассистент работает в резервном режиме
# (находит документы и формирует ответ из их фрагментов).
assistant:
  llm:
    enabled: ${OPENAI_ENABLED:true}
    provider: ${LLM_PROVIDER:OpenAI}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-terra}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:low}
    max-output-tokens: ${OPENAI_MAX_OUTPUT_TOKENS:1600}
    timeout-seconds: ${OPENAI_TIMEOUT_SECONDS:60}
    retry-attempts: ${OPENAI_RETRY_ATTEMPTS:2}
    max-concurrent-requests: ${OPENAI_MAX_CONCURRENT_REQUESTS:2}
    queue-timeout-millis: ${OPENAI_QUEUE_TIMEOUT_MILLIS:500}
    circuit-failure-threshold: ${OPENAI_CIRCUIT_FAILURE_THRESHOLD:3}
    circuit-cooldown-seconds: ${OPENAI_CIRCUIT_COOLDOWN_SECONDS:30}
    response-cache-ttl-seconds: ${OPENAI_RESPONSE_CACHE_TTL_SECONDS:300}
    response-cache-max-entries: ${OPENAI_RESPONSE_CACHE_MAX_ENTRIES:500}
  rag:
    max-documents: ${ASSISTANT_RAG_MAX_DOCUMENTS:15}
    max-chars-per-document: ${ASSISTANT_RAG_MAX_CHARS_PER_DOCUMENT:2400}
    max-history-messages: 8
    max-input-chars: ${ASSISTANT_RAG_MAX_INPUT_CHARS:50000}
    local-context-chars: ${ASSISTANT_RAG_LOCAL_CONTEXT_CHARS:1200}
    max-documents-per-source: ${ASSISTANT_RAG_MAX_DOCUMENTS_PER_SOURCE:2}
    topic-document-limit: ${ASSISTANT_TOPIC_DOCUMENT_LIMIT:80}
    topic-min-confidence: ${OPENAI_TOPIC_MIN_CONFIDENCE:0.65}
    candidate-documents: ${ASSISTANT_RAG_CANDIDATES:64}
  embedding:
    enabled: ${ASSISTANT_EMBEDDING_ENABLED:true}
    base-url: ${EMBEDDING_BASE_URL:${OPENAI_BASE_URL:http://127.0.0.1:1234/v1}}
    api-key: ${EMBEDDING_API_KEY:${OPENAI_API_KEY:lm-studio}}
    model: ${EMBEDDING_MODEL:text-embedding-nomic-embed-text-v1.5}
    chunk-chars: ${ASSISTANT_CHUNK_CHARS:2600}
    chunk-overlap-chars: ${ASSISTANT_CHUNK_OVERLAP_CHARS:320}
    batch-size: ${ASSISTANT_EMBEDDING_BATCH_SIZE:64}
    scan-batch-size: ${ASSISTANT_EMBEDDING_SCAN_BATCH_SIZE:128}
    scan-delay-millis: ${ASSISTANT_EMBEDDING_SCAN_DELAY_MS:1000}
    timeout-seconds: ${ASSISTANT_EMBEDDING_TIMEOUT_SECONDS:60}
    index-path: ${ASSISTANT_VECTOR_INDEX_PATH:data/assistant-vectors}
    query-cache-ttl-seconds: ${ASSISTANT_QUERY_CACHE_TTL_SECONDS:900}
    query-cache-max-entries: ${ASSISTANT_QUERY_CACHE_MAX_ENTRIES:1000}
    auto-retry-failed: ${ASSISTANT_EMBEDDING_AUTO_RETRY_FAILED:true}
    failed-retry-delay-seconds: ${ASSISTANT_EMBEDDING_RETRY_DELAY_SECONDS:300}
  slo:
    sample-window: ${ASSISTANT_SLO_SAMPLE_WINDOW:512}
    minimum-samples: ${ASSISTANT_SLO_MINIMUM_SAMPLES:10}
    retrieval-p95-millis: ${ASSISTANT_SLO_RETRIEVAL_P95_MS:2000}
    time-to-first-token-p95-millis: ${ASSISTANT_SLO_TTFT_P95_MS:5000}
    total-p95-millis: ${ASSISTANT_SLO_TOTAL_P95_MS:20000}
    maximum-failure-rate: ${ASSISTANT_SLO_MAX_FAILURE_RATE:0.01}
    maximum-fallback-rate: ${ASSISTANT_SLO_MAX_FALLBACK_RATE:0.01}

app:
  docs:
    authorization-url: ${AUTH_OPENAPI_URL:http://localhost:5555/v3/api-docs}
    email-url: ${EMAIL_OPENAPI_URL:http://localhost:8771/v3/api-docs}
  security:
    # basic — локальная разработка; jwt — интеграция с внешним сервисом авторизации.
    mode: ${SECURITY_MODE:basic}
    admin-username: ${APP_ADMIN_USERNAME:admin}
    admin-password: ${APP_ADMIN_PASSWORD:}
    external-auth-enabled: ${AUTH_SERVICE_ENABLED:false}
    auth-service-url: ${AUTH_SERVICE_URL:http://localhost:5555}
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}
    assistant-rate-limit-per-minute: ${ASSISTANT_RATE_LIMIT_PER_MINUTE:30}
    jwt:
      issuer-uri: ${AUTH_ISSUER_URI:}
      jwk-set-uri: ${AUTH_JWK_SET_URI:}
      audience: ${AUTH_AUDIENCE:}
      authorities-claim: ${AUTH_ROLES_CLAIM:roles}
      principal-claim: ${AUTH_PRINCIPAL_CLAIM:sub}

indexing-settings:
  documents:
    enabled: ${DOCUMENT_INDEXING_ENABLED:true}
    max-file-size-bytes: ${DOCUMENT_MAX_FILE_SIZE_BYTES:209715200}
  userAgent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/87.0.4280.88 Safari/537.36"
  referrer: "http://www.google.com"
  site-parallelism: ${INDEXING_SITE_PARALLELISM:6}
  crawl-parallelism: ${INDEXING_CRAWL_PARALLELISM:12}
  max-pages-per-site: ${INDEXING_MAX_PAGES_PER_SITE:1000}
  max-depth: ${INDEXING_MAX_DEPTH:12}
  request-delay-millis: ${INDEXING_REQUEST_DELAY_MILLIS:35}
  sites:
    - url: https://www.vetpress.ru/jour
      name: "Журнал: Аграрная наука"
    - url: https://cyberleninka.ru/
      name: "КИБЕРЛЕНИНКА"


# Конфигурация для научных источников (Scopus, Web of Science, eLibrary)
scientific:
  sources:
    scopus:
      api-key: ${SCOPUS_API_KEY:}
      base-url: https://api.elsevier.com
      max-results: 100
      #wos:
      # api-key: ${WOS_API_KEY:your_wos_api_key_here}
      #base-url: https://api.clarivate.com/api/wos
      #max-results: 100
      #elibrary:
      #api-key: ${ELIBRARY_API_KEY:your_elibrary_api_key_here}
      #base-url: https://elibrary.ru/query_api.asp
      #max-results: 100
    # Темы для автоматического поиска статей по семеноводству и селекции
    seed-breeding-topics:
      # Ключевые слова на английском языке для поиска в Scopus
      keywords-en:
        - seed breeding
        - plant breeding
        - crop improvement
        - seed production
        - seed quality
        - germination
        - hybrid seeds
        - seed treatment
        - molecular breeding
        - genetic improvement
        - seed technology
        - plant genetics
        - seed storage
        - seed certification
        - conventional breeding
      # Ключевые слова на русском языке для поиска в eLibrary
      keywords-ru:
        - семеноводство
        - селекция растений
        - производство семян
        - качество семян
        - всхожесть семян
        - гибридные семена
        - обработка семян
        - молекулярная селекция
        - генетическое улучшение
        - технология семян
        - генетика растений
        - хранение семян
        - сертификация семян
        - традиционная селекция
      # Предопределённые поисковые запросы для Scopus (автоматический поиск)
      search-queries-en:
        - "seed breeding AND genetics"
        - "plant breeding AND seed production"
        - "crop improvement AND seed technology"
        - "seed quality AND germination"
        - "hybrid seed production"
        - "seed treatment AND protection"
        - "molecular breeding AND seeds"
        - "seed storage AND preservation"
        - "seed certification AND standards"
        - "conventional breeding AND modern varieties"
      # Предопределённые поисковые запросы для eLibrary (автоматический поиск)
      search-queries-ru:
        - "семеноводство И селекция"
        - "производство семян И качество"
        - "селекция растений И генетика"
        - "гибридные семена И технология"
        - "хранение семян И сохранность"

# Настройки для извлечения технологий
technology-extraction:
  # Минимальная длина слова для рассмотрения как технологии
  min-word-length: 3
  # Максимальное количество слов в названии технологии (n-gram)
  max-ngram-size: 4
  # Минимальная частота упоминания для включения в результат
  min-frequency: 1
  # Технологические маркеры для английского языка
  tech-markers-en:
    - technology
    - method
    - system
    - approach
    - technique
    - tool
    - platform
    - framework
    - model
    - algorithm
    - gene
    - editing
    - crispr
    - marker
    - sequencing
    - genomic
    - molecular
    - breeding
    - selection
    - hybrid
    - transformation
    - conservation
    - treatment
    - analysis
  # Технологические маркеры для русского языка
  tech-markers-ru:
    - технология
    - метод
    - система
    - подход
    - методика
    - инструмент
    - платформа
    - модель
    - алгоритм
    - ген
    - редактирование
    - маркер
    - секвенирование
    - геномный
    - молекулярный
    - селекция
    - гибрид
    - трансформация
    - консервация
    - обработка
    - анализ
