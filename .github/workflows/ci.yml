name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  search-engine-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Searchengine_1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        run: mvn --batch-mode --no-transfer-progress test

  service-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [authorization, emailsender]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test ${{ matrix.service }}
        run: mvn --batch-mode --no-transfer-progress test
