name: CI and Quality Evidence

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-tests:
    name: JUnit and JaCoCo - ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: search
            title: Search and LLM
            module: Searchengine_1
          - id: authorization
            title: Authorization
            module: authorization
          - id: email
            title: Email sender
            module: emailsender
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: ${{ matrix.module }}/pom.xml
      - name: Run tests and build coverage report
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Collect machine-readable evidence
        if: always()
        shell: bash
        run: |
          mkdir -p "../ci-output/${{ matrix.id }}"
          if [ -d target/surefire-reports ]; then cp -R target/surefire-reports "../ci-output/${{ matrix.id }}/surefire"; fi
          if [ -d target/site/jacoco ]; then cp -R target/site/jacoco "../ci-output/${{ matrix.id }}/jacoco"; fi
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ matrix.id }}
          path: ci-output
          if-no-files-found: warn
          retention-days: 90

  quality-site:
    name: Build visual quality report
    if: always()
    needs: module-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: test-evidence-*
          path: ci-artifacts
          merge-multiple: true
      - name: Build evidence dashboard
        run: node scripts/testing/build-ci-dashboard.mjs ci-artifacts ci-site
      - name: Upload dashboard snapshot
        uses: actions/upload-artifact@v4
        with:
          name: quality-site-snapshot
          path: ci-site
          retention-days: 90

  publish-quality-site:
    name: Publish evidence to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.visibility == 'public'
    needs: quality-site
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: quality-site-snapshot
          path: ci-site
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ci-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deployment-images:
    name: Verify production Docker images
    runs-on: ubuntu-latest
    needs: module-tests
    steps:
      - uses: actions/checkout@v6
      - name: Validate deployment configuration
        working-directory: deploy
        run: docker compose --env-file .env.production.example config --quiet
      - name: Build production images
        working-directory: deploy
        run: docker compose --env-file .env.production.example build
